dataset:
  id: columbia_openalex
  title: Columbia University publications, 2021-2024 (OpenAlex snapshot of 2026-11-23)
  description: 'Works (papers, preprints, books, datasets, ...) published 2021-2024 with at least one author affiliated with
    Columbia University (OpenAlex institution I78577930 and its OpenAlex child institutions: NASA GISS, Lamont-Doherty Earth
    Observatory, ICAP, CZ Biohub NY), taken from the OpenAlex API on 2026-11-23 and never refreshed. Includes all co-authors
    and their institutions, the OpenAlex topic hierarchy, profiles of Columbia-affiliated authors, venues, outgoing references,
    yearly citation counts, keywords and funders.

    '
  scope_exclusions:
  - Works with more than 100 authors are excluded entirely.
  - Columbia University Irving Medical Center (OpenAlex I2799503643) is a separate OpenAlex institution and is NOT part of
    this scope unless a paper also lists Columbia University itself.
  - Affiliated but separate colleges (e.g. Barnard College, Teachers College) are not included unless a paper also lists Columbia
    University itself.
  caveats:
  - Author identities come from OpenAlex's algorithmic disambiguation; common names can be split or merged.
  - Topics, subfields, fields and domains are assigned by OpenAlex's classifier and can be wrong.
  - Citation counts (cited_by_count, work_citations_by_year) are as of the snapshot date; newer works have had less time to
    be cited.
  - citations lists every outgoing reference; only rows with cited_in_snapshot = true point to works that are themselves in
    this dataset (and therefore have metadata here).
  - authors contains profiles only for authors who are Columbia-affiliated on at least one work in the snapshot; other co-authors
    appear only in authorships (name and id).
  - Profile metrics in authors and sources (works_count, cited_by_count, h_index, ...) are global OpenAlex values for the
    whole career / whole venue, not restricted to this snapshot.
  - Some works have no abstract (abstract is NULL), no topic, or no source.
  counting_rules:
  - authorships has one row per (work, author); count works with count(DISTINCT work_id) after joining it.
  - authorships.is_columbia is true when that author lists a Columbia institution on that specific work.
  - A work can have up to 3 topics in work_topics; works.primary_topic_* gives the single primary one.
  - work_topics joins to topics for the full hierarchy domain > field > subfield > topic.
