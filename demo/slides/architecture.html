<h2>How sciviz works</h2>
<div class="sub">A Lead agent plans dynamically and delegates to specialists with isolated contexts; every view must pass a verification gate enforced by the harness.</div>

<text class="t" x="60" y="146">User · Web UI</text>
<text class="s" x="60" y="176">chat with cited answers</text><text class="s" x="60" y="198">selection → next question</text>
<text class="s" x="60" y="220">parameter controls</text><text class="s" x="60" y="242">versions · undo · compare</text><text class="s" x="60" y="264">trace · artifacts · plan</text>
<text class="t" x="60" y="456">View runtime</text>
<text class="s" x="60" y="486">agent-written JS module</text><text class="s" x="60" y="508">in a sandboxed iframe</text>
<text class="s" x="60" y="530">generic contract: data-bound</text><text class="s" x="60" y="552">marks, select · hover ·</text><text class="s" x="60" y="574">highlight · update(params)</text><text class="s" x="60" y="596">→ linked views</text>
<text class="t" x="360" y="288">Lead agent</text>
<text class="s" x="360" y="318">understands the question</text><text class="s" x="360" y="340">plans dynamically (todos)</text>
<text class="s" x="360" y="362">delegates with fixed briefs</text><text class="s" x="360" y="384">shows / edits views</text>
<text class="s" x="360" y="406">answers with artifact citations</text><text class="s" x="360" y="428">runs no code itself</text>
<text class="t" x="680" y="106">Data agent</text><text class="s" x="680" y="136">catalog · read-only SQL</text><text class="s" x="680" y="158">filters, cleans, saves tables</text><text class="s" x="680" y="180">records definitions</text>
<text class="t" x="680" y="326">Analyst agent</text><text class="s" x="680" y="356">Python (pandas, networkx,</text><text class="s" x="680" y="378">scipy, sklearn) · findings</text><text class="s" x="680" y="400">graphs, trees, metrics</text>
<text class="t" x="680" y="546">Viz agent</text><text class="s" x="680" y="576">chooses technique</text><text class="s" x="680" y="598">discovers libraries (npm, docs)</text><text class="s" x="680" y="620">writes + previews module</text>
<text class="t" x="1000" y="106">OpenAlex snapshot</text><text class="s" x="1000" y="136">Columbia, 2021–2024</text><text class="s" x="1000" y="158">55,371 works · DuckDB</text><text class="s" x="1000" y="180">catalog: semantics, caveats</text>
<text class="t" x="1000" y="326">Execution sandbox</text><text class="s" x="1000" y="356">Jupyter kernel per agent</text><text class="s" x="1000" y="378">secrets stripped · timeouts</text><text class="s" x="1000" y="400">pinned JS libraries</text>
<text class="t" x="1000" y="546">Verification gate</text><text class="s" x="1000" y="576">headless render + metrics</text><text class="s" x="1000" y="598">generic interaction tests</text><text class="s" x="1000" y="620">independent Critic (vision)</text>
<text class="t" x="1318" y="326">Harness</text><text class="s" x="1318" y="358">Deep Agents</text><text class="s" x="1318" y="380">on LangGraph</text><text class="s" x="1318" y="420">model escalation</text><text class="s" x="1318" y="442">(GPT-6.2 Astra)</text><text class="s" x="1318" y="482">budget ledger</text><text class="s" x="1318" y="522">event log →</text><text class="s" x="1318" y="544">live trace + replay</text><text class="s" x="1318" y="584">checkpoints,</text><text class="s" x="1318" y="606">interrupts</text>
<text class="s" x="360" y="712" style="font-size:15px;fill:#44403c">Shared workspace: artifacts with lineage (code that produced them) · decision log · view state · events</text>
