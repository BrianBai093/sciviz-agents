<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
#page{position:absolute;left:40px;top:92px;height:700px;box-shadow:0 2px 14px rgba(0,0,0,.12);background:#fff}
#hl{position:absolute;border:3px solid #2a78d6;border-radius:6px;background:rgba(42,120,214,.06)}
#zoom{position:absolute;left:640px;top:92px;width:920px;height:700px;background:#fff no-repeat;border-radius:10px;
  box-shadow:0 2px 14px rgba(0,0,0,.12);border:3px solid #2a78d6;box-sizing:border-box}
</style></head><body>
<div class="head"><span class="k">The report</span><span id="label"></span></div>
<img id="page"><div id="hl"></div><div id="zoom"></div>
<script>
const q=new URLSearchParams(location.search), src='pages/p'+q.get('p')+'.png';
const [x0,y0,x1,y1]=q.get('box').split(',').map(Number);
document.getElementById('label').textContent=q.get('label')||'';
const page=document.getElementById('page'); page.src=src;
page.onload=()=>{ const H=700, W=H*page.naturalWidth/page.naturalHeight, hl=document.getElementById('hl');
  Object.assign(hl.style,{left:(40+x0*W)+'px',top:(92+y0*H)+'px',width:((x1-x0)*W)+'px',height:((y1-y0)*H)+'px'});
  const z=document.getElementById('zoom'), zw=914, zh=694, cw=(x1-x0)*page.naturalWidth, ch=(y1-y0)*page.naturalHeight;
  const s=Math.min(zw/cw, zh/ch), bw=page.naturalWidth*s, bh=page.naturalHeight*s;
  z.style.backgroundImage=`url(${src})`; z.style.backgroundSize=`${bw}px ${bh}px`;
  z.style.backgroundPosition=`${-x0*bw+(zw-cw*s)/2}px ${-y0*bh+(zh-ch*s)/2}px`; };
</script></body></html>
