[project]
name = "sciviz-agents"
version = "0.1.0"
description = "Multi-agent LLM system that answers questions about scholarly data with interactive, AI-modifiable visualizations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=2.0",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
    "playwright>=1.48",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.7.1",
    "matplotlib>=3.11.2",
    "markdown-it-py>=4.3.0",
]

[project.scripts]
sciviz = "sciviz.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sciviz"]

[tool.ruff]
line-length = 110
src = ["backend", "data_pipeline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
